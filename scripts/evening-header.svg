<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182c39"/>
      <stop offset="1" stop-color="#101e2a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f3d9a0" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#c9ae7c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#c9ae7c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="flame" cx="0.5" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#fff6dc"/>
      <stop offset="0.5" stop-color="#f2c871"/>
      <stop offset="1" stop-color="#d99a3e"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b98d58"/>
      <stop offset="1" stop-color="#6e4c2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#e9dcc0">
    <circle cx="90" cy="60" r="2.2" opacity="0.8"/><circle cx="210" cy="130" r="1.6" opacity="0.6"/>
    <circle cx="300" cy="48" r="2.6" opacity="0.9"/><circle cx="400" cy="110" r="1.4" opacity="0.5"/>
    <circle cx="470" cy="40" r="1.8" opacity="0.7"/><circle cx="160" cy="250" r="1.5" opacity="0.4"/>
    <circle cx="350" cy="220" r="1.8" opacity="0.5"/><circle cx="760" cy="56" r="1.8" opacity="0.7"/>
    <circle cx="860" cy="130" r="2.4" opacity="0.85"/><circle cx="960" cy="44" r="1.5" opacity="0.6"/>
    <circle cx="1060" cy="100" r="2.2" opacity="0.8"/><circle cx="1130" cy="210" r="1.6" opacity="0.5"/>
    <circle cx="1010" cy="250" r="1.4" opacity="0.4"/><circle cx="820" cy="240" r="1.7" opacity="0.45"/>
    <circle cx="60" cy="170" r="1.3" opacity="0.5"/><circle cx="1160" cy="40" r="1.4" opacity="0.6"/>
  </g>
  <g fill="#e9dcc0" opacity="0.9">
    <path d="M300 30 l3 15 l15 3 l-15 3 l-3 15 l-3 -15 l-15 -3 l15 -3z" transform="scale(1)" opacity="0.7"/>
    <path d="M1060 82 l2.4 12 l12 2.4 l-12 2.4 l-2.4 12 l-2.4 -12 l-12 -2.4 l12 -2.4z" opacity="0.7"/>
  </g>
  <!-- crescent moon -->
  <g transform="translate(150 70)"><circle r="26" fill="#e9dcc0" opacity="0.85"/><circle cx="11" cy="-7" r="24" fill="#172a37"/></g>
  <!-- lamp glow -->
  <ellipse cx="720" cy="185" rx="270" ry="175" fill="url(#glow)"/>
  <!-- clay oil lamp -->
  <g transform="translate(600 250)">
    <ellipse cx="0" cy="44" rx="120" ry="12" fill="#000" opacity="0.35"/>
    <!-- handle -->
    <path d="M-112 6 q-34 -4 -34 -26 q0 -16 18 -18" fill="none" stroke="#8a6338" stroke-width="12" stroke-linecap="round"/>
    <!-- body + spout -->
    <path d="M-118 4 C-118 -34 -60 -48 0 -48 C40 -48 74 -40 96 -24 C112 -14 126 -14 140 -18 C152 -21 158 -12 150 -2 C140 12 118 14 98 22 C70 34 40 40 0 40 C-60 40 -118 32 -118 4 Z" fill="url(#clay)"/>
    <!-- filling hole + rim -->
    <ellipse cx="-14" cy="-30" rx="40" ry="10" fill="#4f351c"/>
    <ellipse cx="-14" cy="-32" rx="40" ry="10" fill="none" stroke="#c9a06a" stroke-width="3" opacity="0.7"/>
    <!-- decoration -->
    <path d="M-90 10 Q-20 26 70 12" fill="none" stroke="#c9a06a" stroke-width="2.5" opacity="0.5"/>
    <!-- wick -->
    <path d="M144 -16 q4 -8 2 -14" stroke="#2b1c10" stroke-width="4" fill="none" stroke-linecap="round"/>
    <!-- flame -->
    <path d="M146 -26 C126 -46 132 -76 148 -104 C152 -80 176 -62 168 -40 C164 -28 156 -24 146 -26 Z" fill="url(#flame)"/>
    <path d="M148 -32 C140 -44 144 -60 150 -72 C154 -58 162 -50 158 -40 C156 -34 152 -32 148 -32 Z" fill="#fffaf0" opacity="0.85"/>
  </g>
</svg>
